name: Validar ordem webhook e acesso
on:
  push:
    branches:
      - fix/priorizar-etiqueta-antes-acesso-20261112
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --test tests/checkout-access-pabbly.test.mjs tests/checkout-tag-priority.test.mjs tests/checkout-outbound.test.mjs
